<style>
#twin-name-first{--tw-white:light-dark(#fff,#fff);--tw-ink:light-dark(#0b0b0b,#0b0b0b);--tw-red:#dd2e06;--tw-muted:#717171;--tw-line:#d9d9d6;--tw-paper:light-dark(#f0f0ee,#f0f0ee);--tw-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--tw-body:"Barlow",Arial,sans-serif;width:100%;color:var(--tw-ink);font:400 16px/1.4 var(--tw-body)}
#twin-name-first *{box-sizing:border-box}
#twin-name-first button,#twin-name-first input,#twin-name-first textarea{font:inherit}
#twin-name-first button,#twin-name-first a,#twin-name-first summary,#twin-name-first label[for]{-webkit-tap-highlight-color:transparent}
#twin-name-first button:disabled{opacity:.36;cursor:default}
#twin-name-first [hidden]{display:none!important}
#twin-name-first .tw-preview-label{padding:5px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:light-dark(#666,#aaa);font:500 11px/1.4 var(--tw-body);letter-spacing:.06em;text-transform:uppercase}
#twin-name-first .tw-preview-label span:last-child{font-weight:400;letter-spacing:0;text-transform:none}
#twin-name-first .tw-canvas{background:var(--tw-paper);padding:22px 14px}
#twin-name-first .tw-screen{width:min(100%,460px);margin:auto;background:var(--tw-white);border-right:1px solid var(--tw-ink);border-bottom:1px solid var(--tw-ink);color:var(--tw-ink)}
#twin-name-first .tw-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 25px 21px}
#twin-name-first .tw-wordmark{font:900 34px/.9 var(--tw-display);letter-spacing:-.025em;margin:0;color:var(--tw-ink)}
#twin-name-first .tw-account{display:flex;align-items:center;gap:8px;color:var(--tw-muted);font:600 11px/1 var(--tw-body);letter-spacing:.07em;text-transform:uppercase;max-width:58%;overflow-wrap:anywhere}
#twin-name-first .tw-account-dot{width:6px;height:6px;background:var(--tw-red);flex:none}
#twin-name-first .tw-progress{height:2px;margin:0 25px;background:var(--tw-line)}
#twin-name-first .tw-progress-fill{height:100%;display:block;background:var(--tw-red)}
#twin-name-first .tw-stage{padding:33px 25px 28px;min-height:460px}
#twin-name-first .tw-kicker{display:flex;align-items:center;gap:9px;color:var(--tw-red);font:700 13px/1.2 var(--tw-display);letter-spacing:.11em;text-transform:uppercase;margin:0 0 17px}
#twin-name-first .tw-square{display:inline-block;width:7px;height:7px;background:var(--tw-red);flex:none}
#twin-name-first h1{color:var(--tw-ink);font:800 clamp(42px,7vw,57px)/.97 var(--tw-display);letter-spacing:-.025em;text-transform:none;margin:0 0 17px}
#twin-name-first h2{color:var(--tw-ink);font:700 26px/1.05 var(--tw-display);letter-spacing:-.01em;margin:0 0 8px}
#twin-name-first h3{color:var(--tw-ink);font:700 22px/1.1 var(--tw-display);margin:0 0 7px}
#twin-name-first p{margin:0}
#twin-name-first .tw-description{color:var(--tw-muted);font-size:16px;line-height:1.45;max-width:370px}
#twin-name-first .tw-name-form{margin-top:47px}
#twin-name-first .tw-label{display:block;font:600 11px/1.3 var(--tw-body);letter-spacing:.12em;margin-bottom:10px;text-transform:uppercase}
#twin-name-first .tw-name-input{width:100%;border:1px solid var(--tw-line);border-radius:0;background:var(--tw-white);color:var(--tw-ink);padding:14px 15px;font:500 26px/1.2 var(--tw-body);box-shadow:none}
#twin-name-first input::placeholder,#twin-name-first textarea::placeholder{color:#aaa}
#twin-name-first .tw-name-footnote{color:var(--tw-muted);font-size:12px;margin-top:12px}
#twin-name-first .tw-footer{padding:0 25px 23px}
#twin-name-first .tw-footer-rule{height:1px;background:var(--tw-ink);margin:0 0 19px}
#twin-name-first .tw-footer-content{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#twin-name-first .tw-step-count{font:600 12px/1 var(--tw-display);letter-spacing:.1em;color:var(--tw-muted)}
#twin-name-first .tw-primary{border:0;border-radius:999px;background:var(--tw-red);color:#fff;min-height:49px;padding:14px 24px;font:700 20px/1 var(--tw-display);letter-spacing:.025em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:20px;text-decoration:none;white-space:nowrap}
#twin-name-first .tw-primary:hover:not(:disabled){background:#c92804}
#twin-name-first .tw-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--tw-ink);border-radius:0;background:var(--tw-white);color:var(--tw-ink);min-height:41px;padding:10px 13px;font:700 14px/1 var(--tw-display);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
#twin-name-first .tw-text-button{border:0;border-radius:0;background:none;color:var(--tw-ink);font:600 12px/1.3 var(--tw-body);padding:9px 0;text-decoration:underline;text-underline-offset:3px}
#twin-name-first .tw-back{border:1px solid var(--tw-ink);border-radius:0;background:var(--tw-white);color:var(--tw-ink);width:35px;height:35px;font:400 23px/1 var(--tw-body);padding:0}
#twin-name-first .tw-back-row{display:flex;gap:10px;align-items:center}
#twin-name-first .tw-how{list-style:none;padding:0;margin:25px 0 20px}
#twin-name-first .tw-how li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--tw-line);font-size:14px;color:var(--tw-muted)}
#twin-name-first .tw-how li:first-child{border-top:1px solid var(--tw-ink)}
#twin-name-first .tw-how strong{font-weight:500;color:var(--tw-ink)}
#twin-name-first .tw-how .tw-num{font:700 18px/1.2 var(--tw-display);color:var(--tw-red)}
#twin-name-first .tw-prompt-box{border:1px solid var(--tw-ink);margin:19px 0 13px;padding:17px}
#twin-name-first .tw-prompt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
#twin-name-first .tw-prompt-top span{font:600 11px/1 var(--tw-body);letter-spacing:.06em;text-transform:uppercase}
#twin-name-first .tw-prompt-excerpt{font-size:13px;line-height:1.5;color:var(--tw-muted)}
#twin-name-first details{margin-top:12px}
#twin-name-first summary{font:600 12px/1.4 var(--tw-body);text-decoration:underline;text-underline-offset:3px}
#twin-name-first pre{font:400 12px/1.5 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--tw-muted);margin:15px 0 0}
#twin-name-first .tw-json-label{margin-top:30px}
#twin-name-first .tw-json{display:block;width:100%;min-height:204px;padding:15px;border:1px solid var(--tw-ink);border-radius:0;background:var(--tw-white);color:var(--tw-ink);font:400 12px/1.5 ui-monospace,SFMono-Regular,monospace;resize:vertical}
#twin-name-first .tw-import-links{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
#twin-name-first .tw-file-label{font:600 12px/1.3 var(--tw-body);text-decoration:underline;text-underline-offset:3px}
#twin-name-first .tw-error{font-size:13px;color:#ba2707;margin-top:12px}
#twin-name-first .tw-note{font-size:12px;color:var(--tw-muted);margin-top:14px;line-height:1.45}
#twin-name-first .tw-import-success{font-size:12px;border-bottom:1px solid var(--tw-line);padding:0 0 17px;margin-bottom:22px;color:var(--tw-muted)}
#twin-name-first .tw-photo-box{margin:24px 0 0;border:1px solid var(--tw-ink);min-height:224px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:22px;background:var(--tw-white)}
#twin-name-first .tw-photo-box i{width:36px;height:36px;color:var(--tw-muted)}
#twin-name-first .tw-photo-box img{width:100%;max-width:255px;max-height:260px;object-fit:contain}
#twin-name-first .tw-photo-box .tw-avatar-image{max-height:310px;width:auto}
#twin-name-first .tw-photo-box p{font-size:13px;color:var(--tw-muted)}
#twin-name-first .tw-photo-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
#twin-name-first .tw-sample-tag{color:var(--tw-muted);font:600 10px/1.2 var(--tw-body);letter-spacing:.08em;text-transform:uppercase}
#twin-name-first .tw-avatar-confirm{margin-top:15px;border-top:1px solid var(--tw-ink);padding-top:16px}
#twin-name-first .tw-review-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:15px 4px 0}
#twin-name-first .tw-review-nav button{border:0;border-radius:0;background:none;color:light-dark(#626262,#aaa);font:500 11px/1.4 var(--tw-body);padding:4px 0}
#twin-name-first .tw-review-nav button[aria-current="step"]{color:light-dark(#0b0b0b,#fff);text-decoration:underline;text-underline-offset:4px}
#twin-name-first .tw-status{padding:10px 0 0;min-height:27px;font-size:12px;color:light-dark(#666,#aaa);text-align:center}
@media(max-width:420px){#twin-name-first .tw-canvas{padding:12px 0}#twin-name-first .tw-header{padding:24px 20px 20px}#twin-name-first .tw-stage{padding:30px 20px 25px}#twin-name-first .tw-progress{margin:0 20px}#twin-name-first .tw-footer{padding:0 20px 22px}#twin-name-first h1{font-size:46px}#twin-name-first .tw-preview-label{padding-right:80px;align-items:flex-start;flex-direction:column;gap:3px}#twin-name-first .tw-plugin{gap:8px;grid-template-columns:35px minmax(0,1fr) auto}#twin-name-first .tw-plugin-icon{width:32px;height:32px}#twin-name-first .tw-primary{font-size:18px;padding:14px 19px;gap:12px}#twin-name-first .tw-step-count{font-size:11px}#twin-name-first .tw-review-nav{gap:9px}}
@media(pointer:coarse){#twin-name-first input,#twin-name-first textarea{font-size:16px}#twin-name-first .tw-name-input{font-size:31px}#twin-name-first button,#twin-name-first label[for],#twin-name-first summary{min-height:44px}#twin-name-first .tw-review-nav button{padding:10px 0}}

#twin-name-first .tw-gpt-actions{margin-top:27px}
#twin-name-first .tw-gpt-step{padding:19px 0;border-top:1px solid var(--tw-line)}
#twin-name-first .tw-gpt-step:first-child{border-color:var(--tw-ink)}
#twin-name-first .tw-gpt-step-label{display:flex;align-items:baseline;gap:11px;font:700 23px/1.12 var(--tw-display);color:var(--tw-ink);margin-bottom:9px}
#twin-name-first .tw-gpt-step-label>span{font:700 18px/1 var(--tw-display);color:var(--tw-red);flex:none}
#twin-name-first .tw-gpt-step-help{color:var(--tw-muted);font-size:14px;line-height:1.45;margin-bottom:13px}
#twin-name-first .tw-gpt-button{display:flex;justify-content:space-between;width:100%;min-height:56px;padding:16px 23px;font-size:23px}
#twin-name-first .tw-gpt-open{border:1px solid var(--tw-ink);background:var(--tw-white);color:var(--tw-ink)}
#twin-name-first .tw-gpt-open:hover{background:var(--tw-paper)}
#twin-name-first .tw-gpt-step details{margin-top:15px}
#twin-name-first .tw-export-command{padding:11px 0 15px;font:600 21px/1.15 var(--tw-display);color:var(--tw-ink)}
</style>

  const PROMPT=`You are helping me create a private Personal Twin profile for a digital twin app. Talk with me naturally, one question at a time. Be warm, curious, and concise. I can skip any question. Do not assume facts when a follow-up question would help.

First learn what my life looks like NOW. Ask about my current work or school, responsibilities, recurring commitments, and ordinary weekday and weekend routines. Learn about sleep, meals, movement, travel, focused work, breaks, and free time. Ask for my IANA time zone and distinguish fixed times from approximate or flexible times.

Ask me to walk you through one representative CURRENT day, from waking up to going to sleep. Use a typical weekday unless another kind of day better represents my life. Ask which commitments are fixed, what varies, and whether weekends differ. This is a description of my existing routine, not an ideal schedule or a report of what I did today. Do not invent activities, durations, start times, or an ideal sample day to fill gaps.

Then learn about what matters to me: current goals and priorities, habits I want to build, preferences, boundaries the app must respect, when I tend to have energy or feel drained, what helps me reset, and what distracts me. Clearly separate what I ACTUALLY DO NOW from what I WANT TO CHANGE. Wanting to exercise every morning does not mean I already exercise every morning. Do not diagnose me or infer permanent personality traits from a single comment.

Do not ask for passwords, API keys, medical diagnoses, or a full email history. Include only information I willingly share. Do not present yourself as a therapist.

Before exporting, summarize my current activities, representative day, goals, preferences, and boundaries in plain language. Let me correct anything inaccurate. Keep important distinctions and uncertainty in the final observations.

When I say "Finish and export JSON", output ONLY valid JSON, without a Markdown fence or explanation. Use the existing Twin handoff contract below. Do not add new top-level fields for a transcript, summary, sample_day, or schedule. Represent the representative day's actual details as individual observations using the existing supported kinds.

{
  "schema_version": 1,
  "source": "chatgpt_voice_onboarding",
  "session_id": "a stable unique ID for this conversation",
  "created_at": "an ISO 8601 UTC timestamp",
  "timezone": "an IANA time zone such as America/New_York",
  "observations": [
    {
      "id": "a unique ID within this export",
      "kind": "routine",
      "statement": "one concise, self-contained fact describing current behavior, a commitment, a goal, or another supported observation",
      "source_excerpt": "a short supporting phrase from what I actually said",
      "confidence": "user_stated"
    }
  ]
}

Allowed kind values: routine, commitment, sleep, energy_cue, wellbeing_cue, distraction, goal, boundary.
Allowed confidence values: user_stated, inferred.

Use one observation per fact, between 1 and 100 observations, with unique IDs. Keep statements under 600 characters and source excerpts under 240 characters. Use user_stated only for information I explicitly provided. Mark interpretations inferred, and never make an inference sound certain.

Include the recurring day or context in each relevant statement, such as "On a typical weekday..." or "On Tuesdays...". Say whether times are fixed or approximate when known. Use goal for desired changes and routine for current habits. A sample-day description is not a calendar event and must not be presented as an activity completed today.

Use my corrections in the final export. Do not invent calendar events, missing commitments, verbatim transcripts, or additional profile fields. Do not include the full transcript in source_excerpt. Ensure the final JSON parses and uses only the supported schema.`;
  const example=()=>JSON.stringify({schema_version:1,source:'chatgpt_voice_onboarding',session_id:'mockup-example',created_at:new Date().toISOString(),timezone:'America/New_York',observations:[{"id": "current-role", "kind": "routine", "statement": "I currently attend classes on weekdays and study between classes.", "source_excerpt": "I have classes during the week.", "confidence": "user_stated"}, {"id": "weekday-wake", "kind": "sleep", "statement": "On a typical weekday, I wake around 7:30 AM; the time is approximate.", "source_excerpt": "Usually around seven thirty.", "confidence": "user_stated"}, {"id": "weekday-lunch", "kind": "routine", "statement": "On a typical weekday, lunch is around 12:30 PM and is flexible.", "source_excerpt": "Lunch around twelve thirty.", "confidence": "user_stated"}, {"id": "walk", "kind": "wellbeing_cue", "statement": "A short walk after lunch helps me reset.", "source_excerpt": "Walking after lunch helps.", "confidence": "user_stated"}, {"id": "study-goal", "kind": "goal", "statement": "I want to make more time for focused studying.", "source_excerpt": "I want to study with fewer interruptions.", "confidence": "user_stated"}, {"id": "evening-boundary", "kind": "boundary", "statement": "I want to keep late evenings free of focused work.", "source_excerpt": "Keep late evenings free.", "confidence": "user_stated"}]},null,2);
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const name=()=>state.name.trim()||'you';
  const kicker=text=>`<p class="tw-kicker"><span class="tw-square" aria-hidden="true"></span>${text}</p>`;
  const primary=(text,action,disabled=false)=>`<button class="tw-primary cursor-interaction" type="button" data-action="${action}" ${disabled?'disabled':''}>${text}<span aria-hidden="true">→</span></button>`;
  const header=()=>`<header class="tw-header"><p class="tw-wordmark">TWIN</p><span class="tw-account">${state.step===0?'LET’S BEGIN':`<span class="tw-account-dot" aria-hidden="true"></span>${esc(state.name?state.name+'’S TWIN':'YOUR TWIN')}`}</span></header>`;
  function footer(label,action,disabled=false,skip=''){
    return `<footer class="tw-footer"><div class="tw-footer-rule"></div><div class="tw-footer-content"><div class="tw-back-row">${state.step>0?'<button class="tw-back cursor-interaction" type="button" data-action="back" aria-label="Previous step">←</button>':''}<span class="tw-step-count">0${state.step+1} / 04</span></div>${primary(label,action,disabled)}</div>${skip?`<button class="tw-text-button cursor-interaction" type="button" data-action="${skip}">I’ll do this later</button>`:''}</footer>`;
  }
  function content(){
    if(state.step===0)return `<main class="tw-stage">${kicker('Your twin starts here')}<h1>What should<br>we call you?</h1><p class="tw-description">A fresh start. A little about you.<br>A Twin that grows from there.</p><form id="tw-name-form" class="tw-name-form"><label class="tw-label" for="tw-name">Your name</label><input class="tw-name-input" id="tw-name" name="name" autocomplete="given-name" maxlength="50" placeholder="Enter your name" value="${esc(state.name)}" required><p class="tw-name-footnote">Start by creating your personal Twin profile.</p><button type="submit" hidden>Create account</button></form></main>${footer('Create account','create',!state.name.trim())}`;
    if(state.step===1)return `<main class="tw-stage">${kicker(`Nice to meet you${state.name?', '+esc(state.name):''}`)}<h1>Let’s get<br>to know you.</h1><p class="tw-description">Use ChatGPT to tell Twin about your life.<br>Here’s how to get started.</p><div class="tw-gpt-actions"><section class="tw-gpt-step"><p class="tw-gpt-step-label"><span>01</span> Copy this prompt</p><p class="tw-gpt-step-help">The prompt tells ChatGPT what to ask you.</p><button class="tw-primary tw-gpt-button cursor-interaction" type="button" data-action="copy">Copy prompt <span aria-hidden="true">↗</span></button><details data-prompt-details><summary class="cursor-interaction">See the full prompt</summary><pre data-prompt-text>${esc(PROMPT)}</pre></details></section><section class="tw-gpt-step"><p class="tw-gpt-step-label"><span>02</span> Open ChatGPT and paste it</p><p class="tw-gpt-step-help">Start a new chat, then paste the prompt you copied.</p><a class="tw-primary tw-gpt-button tw-gpt-open cursor-interaction" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT <span aria-hidden="true">↗</span></a></section><section class="tw-gpt-step"><p class="tw-gpt-step-label"><span>03</span> Talk, then bring back your output</p><p class="tw-gpt-step-help">Paste and send the prompt. To talk, tap ChatGPT’s Voice icon, then answer its questions. When you’re done, say:</p><p class="tw-export-command">“Finish and export JSON”</p><p class="tw-gpt-step-help">Copy its final output. Come back here and tap the button below.</p></section></div></main>${footer('I have my output','next')}`;
    if(state.step===2)return `<main class="tw-stage">${kicker('Bring it back')}<h1>Your story.<br>Now in Twin.</h1><p class="tw-description">Paste ChatGPT’s final output below.<br>This is where your Twin starts learning.</p><label class="tw-label tw-json-label" for="tw-json">ChatGPT’s final output</label><textarea class="tw-json" id="tw-json" spellcheck="false" placeholder='Paste your JSON here…'>${esc(state.json)}</textarea><div class="tw-import-links"><label class="tw-file-label cursor-interaction" for="tw-json-file">Upload a JSON file ↗</label><input hidden id="tw-json-file" type="file" accept=".json,application/json"><button class="tw-text-button cursor-interaction" type="button" data-action="example">Try example output</button></div>${state.error?`<p class="tw-error" role="alert">${esc(state.error)}</p>`:''}<p class="tw-note">You choose what to bring over. Your full ChatGPT conversation stays in ChatGPT.</p></main>${footer('Import & continue','import',!state.json.trim())}`;
    if(state.step===3){
      const photoBody=state.avatar?`<img class="tw-avatar-image" src="${AVATAR}" alt="Example Twin avatar from the existing app"><span class="tw-sample-tag">Sample avatar preview</span>`:state.photo?`<img src="${esc(state.photo)}" alt="Your selected reference photo">`:state.sample?`<img class="tw-avatar-image" src="${AVATAR}" alt="Example avatar used for this mockup"><span class="tw-sample-tag">Example reference</span>`:`<i data-lucide="user-round" aria-hidden="true"></i><p>A clear photo of you.</p><label class="tw-secondary cursor-interaction" for="tw-photo">Choose photo ↗</label>`;
      return `<main class="tw-stage">${state.imported?`<p class="tw-import-success">✓ ${state.imported} things brought over. Your Twin is taking shape.</p>`:''}${kicker('Give your twin a face')}<h1>A little<br>more like you.</h1><p class="tw-description">Upload a photo. Twin turns it into<br>your own illustrated avatar.</p><div class="tw-photo-box">${photoBody}</div><input hidden id="tw-photo" type="file" accept="image/png,image/jpeg,image/webp"><div class="tw-photo-actions"><label class="tw-file-label cursor-interaction" for="tw-photo">${state.photo||state.sample?'Change photo ↗':'PNG, JPEG, or WebP'}</label><button class="tw-text-button cursor-interaction" type="button" data-action="sample">Try sample avatar</button></div>${state.avatar?`<div class="tw-avatar-confirm"><h3>Does this feel like you?</h3><p class="tw-description">Approve your look, or try another version.</p><button class="tw-text-button cursor-interaction" type="button" data-action="regenerate">Try another version</button></div>`:'<p class="tw-note">Your photo is used to create a consistent look for your Twin.</p>'}</main>${footer(state.avatar?'Finish setup':state.photo||state.sample?'Create avatar':'Continue later',state.avatar?'next':state.photo||state.sample?'generate':'next',false,state.photo||state.sample?'skip':'')}`;
    }
    return '';
  }
  function render(){
    stage.innerHTML=header()+`<div class="tw-progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${state.step+1}"><span class="tw-progress-fill" style="width:${(state.step+1)*25}%"></span></div>`+content();
    root.querySelectorAll('[data-jump]').forEach(b=>{if(Number(b.dataset.jump)===state.step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
    if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:20,height:20}});
  }
  function persist(){
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mockup:'Twin name-first onboarding',screen:state.step,phoneSignIn:'later'},privateContent:{version:4,step:state.step,name:state.name}}).catch(()=>{});
  }
  function go(step){state.step=Math.max(0,Math.min(3,step));state.error='';status.textContent='';render();persist();}
  function complete(){status.textContent='First four screens complete. The app can now resume its existing connection flow or Home.';root.dispatchEvent(new CustomEvent('twin:onboarding-complete',{bubbles:true,detail:{name:state.name,avatarApproved:state.avatar}}));}
  function create(){state.name=state.name.trim();if(state.name)go(1);}
  root.addEventListener('submit',event=>{if(event.target.id==='tw-name-form'){event.preventDefault();create();}});
  root.addEventListener('input',event=>{
    if(event.target.id==='tw-name'){state.name=event.target.value;root.querySelector('[data-action="create"]').disabled=!state.name.trim();}
    if(event.target.id==='tw-json'){state.json=event.target.value;root.querySelector('[data-action="import"]').disabled=!state.json.trim();}
  });
  root.addEventListener('change',async event=>{
    if(!['tw-photo','tw-json-file'].includes(event.target.id))return;
    const file=event.target.files?.[0];if(!file)return;
    if(event.target.id==='tw-json-file'){
      if(file.size>256000){status.textContent='Choose a JSON file under 256 KB.';return;}
      state.json=await file.text();render();status.textContent='JSON file loaded. Review it, then import.';return;
    }
    if(file.size>8000000||!['image/png','image/jpeg','image/webp'].includes(file.type)){status.textContent='Choose a PNG, JPEG, or WebP photo under 8 MB.';return;}
    const reader=new FileReader();reader.onload=()=>{state.photo=String(reader.result);state.sample=false;state.avatar=false;render();status.textContent='Photo selected for this preview only.';};reader.readAsDataURL(file);
  });
  root.addEventListener('click',async event=>{
    const jump=event.target.closest('[data-jump]');if(jump){go(Number(jump.dataset.jump));return;}
    const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action;
    if(action==='create')return create();
    if(action==='back')return go(state.step-1);
    if(action==='next'||action==='skip'){if(state.step===3)return complete();return go(state.step+1);}
    if(action==='example'){state.json=example();state.error='';render();return;}
    if(action==='import'){
      let data;try{data=JSON.parse(state.json);}catch{state.error='This needs to be valid JSON. Try the example to see how it works.';render();return;}
      if(data.schema_version!==1||!Array.isArray(data.observations)||!data.observations.length||data.observations.some(x=>!x||typeof x.statement!=='string')){state.error='Paste the final Twin export, including its observations, or try the example.';render();return;}
      state.imported=data.observations.length;return go(3);
    }
    if(action==='copy'){
      try{if(!navigator.clipboard?.writeText)throw new Error();await navigator.clipboard.writeText(PROMPT);button.textContent='Copied ✓';status.textContent='Prompt copied. Paste it into a new ChatGPT conversation.';}
      catch{const details=root.querySelector('[data-prompt-details]');details.open=true;const text=root.querySelector('[data-prompt-text]');if(window.getSelection&&document.createRange){const range=document.createRange();range.selectNodeContents(text);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);}status.textContent='The full prompt is selected. Use your copy shortcut.';}
      return;
    }
    if(action==='sample'){state.sample=true;state.photo='';state.avatar=true;render();return;}
    if(action==='generate'||action==='regenerate'){state.avatar=true;render();status.textContent='Mockup: showing the app’s existing sample avatar.';return;}
  });
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next?.version===4){state.name=next.name||'';state.step=Math.max(0,Math.min(3,next.step||0));render();}});
  render();
})();
</script>
